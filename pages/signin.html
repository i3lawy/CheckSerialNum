<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CheckSerialNum - Sign In</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="frame">

    <!-- Navigation bar -->
    <nav class="navbar">
      <a class="logo" href="../index.html">CheckSerialNum</a>
      <div class="menu">
        <a href="../index.html">Home</a>
        <a href="register-device.html">Register Device</a>
        <a href="report-stolen.html">Report Stolen</a>
        <a class="active" href="signin.html">Sign In</a>
      </div>
    </nav>

    <header class="hero">
      <h1>Sign in <span class="grey-text">or create an account.</span></h1>
      <p>Access your device registrations and theft reports.</p>
    </header>

    <main class="content">
      <div class="two-columns">

        <!-- Sign in form -->
        <div class="card">
          <h2>Sign In</h2>
          <form action="#">
            <label for="signin-mobile">Mobile Number</label>
            <input type="tel" id="signin-mobile" name="mobile" placeholder="05XXXXXXXX" pattern="05[0-9]{8}" required>

            <label for="signin-password">Password</label>
            <input type="password" id="signin-password" name="password" required>

            <button class="button" type="submit">Sign In</button>
          </form>
          <p class="hint">Forgot password? Contact support with your registered mobile number.</p>
        </div>

        <!-- Register form -->
        <div class="card">
          <h2>Create an Account</h2>
          <form action="#">
            <label for="account-type">Account Type</label>
            <select id="account-type" name="role">
              <option>Device owner</option>
              <option>Shop owner</option>
            </select>

            <label for="full-name">Full Name</label>
            <input type="text" id="full-name" name="full_name" required>

            <label for="national-id">National ID or Iqama</label>
            <input type="text" id="national-id" name="national_id" placeholder="10 digits" pattern="[12][0-9]{9}" required>

            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" name="mobile" placeholder="05XXXXXXXX" pattern="05[0-9]{8}" required>

            <label for="language">Preferred Language</label>
            <select id="language" name="language">
              <option>English</option>
              <option>Arabic</option>
            </select>

            <label for="cr-file">Commercial Registration (shop owners only)</label>
            <input type="file" id="cr-file" name="cr_document" accept=".pdf,.jpg,.jpeg">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" minlength="8" placeholder="8+ characters" required>

            <div class="checkbox-row">
              <input type="checkbox" id="terms" required>
              <label for="terms" style="margin: 0; font-weight: normal;">I agree to the Terms and the Privacy notice (PDPL).</label>
            </div>

            <button class="button" type="submit">Create Account</button>
          </form>
        </div>

      </div>
    </main>

    <footer class="footer">
      <span>&copy; 2026 CheckSerialNum.</span>
      <span>Sign In / Registration</span>
    </footer>

  </div>

</body>
</html>
